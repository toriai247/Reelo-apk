name: Build Reelo Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from base64"
          fi

      - name: Configure Environment (.env)
        run: |
          # Use GitHub repository secrets if available, otherwise fallback to live publishable credentials
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://ffbmozwsasbhevtehbit.supabase.co"
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            SUPABASE_ANON_KEY="sb_publishable_kzXQl0X6eNtzFrAuY-3EFw_pYh6H-qr"
          fi

          echo "SUPABASE_URL=\"$SUPABASE_URL\"" > .env
          echo "SUPABASE_ANON_KEY=\"$SUPABASE_ANON_KEY\"" >> .env
          echo "Created .env successfully"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace
        env:
          SUPABASE_URL: "https://ffbmozwsasbhevtehbit.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_kzXQl0X6eNtzFrAuY-3EFw_pYh6H-qr"

      - name: Upload Test Report Artifact (On Failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" app/build/outputs/apk/debug/reelo-app-debug.apk
            echo "APK ready at: app/build/outputs/apk/debug/reelo-app-debug.apk"
          else
            echo "Error: APK not found"
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reelo-debug-apk
          path: app/build/outputs/apk/debug/reelo-app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/reelo-app-debug.apk
          name: Reelo Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
